name: IndexNow
# Na elke push naar main: gewijzigde pagina's melden bij Bing en andere IndexNow-zoekmachines.
# Handmatig (Actions, Run workflow): alle URL's uit de sitemap melden.
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', '.github/workflows/indexnow.yml']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Gewijzigde pagina's melden
        if: github.event_name == 'push'
        env:
          WAIT: '120'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'indexnow.yml'; then python3 .github/scripts/indexnow.py all
          else python3 .github/scripts/indexnow.py $(git diff --name-only HEAD~1 HEAD -- '*.html'); fi
      - name: Alle pagina's melden
        if: github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/indexnow.py all
